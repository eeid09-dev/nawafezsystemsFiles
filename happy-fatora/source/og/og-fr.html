<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Cairo','DejaVu Sans',sans-serif;color:#fff;position:relative;
 background:radial-gradient(circle at 12% 8%,rgba(255,152,0,.35),transparent 38%),radial-gradient(circle at 92% 95%,rgba(155,225,93,.35),transparent 40%),linear-gradient(135deg,#124d17 0%,#1f6f28 45%,#2e8b34 100%)}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.10) 2px,transparent 2px) 0 0/34px 34px}
.wrap{position:absolute;inset:0;display:flex;flex-direction:row-reverse}
.phones{position:relative;width:470px;flex:none}
.ph{position:absolute;width:262px;border-radius:34px;border:8px solid #0b0f0c;background:#0b0f0c;overflow:hidden;box-shadow:0 30px 60px -18px rgba(0,0,0,.65)}
.ph img{display:block;width:100%;height:auto}
.p1{top:60px;right:150px;transform:rotate(6deg);z-index:2}
.p2{top:130px;right:-10px;transform:rotate(-7deg);opacity:.96}
.txt{flex:1;padding:46px 56px 0 0;padding:46px 56px 0 56px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.brand img{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.name{font-size:62px;font-weight:900;line-height:1.15;white-space:nowrap;letter-spacing:-1px}
.head{font-size:31px;white-space:nowrap;font-weight:800;line-height:1.35;color:#ffd27a;margin-top:6px}
.sub{font-size:27px;font-weight:600;opacity:.92;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chip{padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);font-weight:700;font-size:19px}
.bar{position:absolute;left:0;right:0;bottom:0;height:128px;z-index:10;background:#0a2a0e;border-top:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:space-between;padding:0 56px;flex-direction:row}
.contact{display:flex;gap:34px;align-items:center}
.c{display:flex;align-items:center;gap:12px}
.c small{display:block;font-size:17px;opacity:.8;font-weight:600;line-height:1.2}
.c b{display:block;font-size:31px;font-weight:800;direction:ltr;unicode-bidi:isolate;line-height:1.2;letter-spacing:.5px}
.co{text-align:right}
.co small{font-size:16px;opacity:.8;font-weight:600;display:block}
.co b{font-size:25px;font-weight:800;display:block;line-height:1.3;color:#ffd27a}
.co span{font-size:19px;font-weight:600;direction:ltr;unicode-bidi:isolate;display:inline-block;opacity:.95}
</style></head>
<body><div class="wrap">
 <div class="phones"><div class="ph p2"><img src="../../site/images/s-stock.jpg"></div><div class="ph p1"><img src="../../site/images/s-pos.jpg"></div></div>
 <div class="txt">
  <div class="brand"><img src="../../site/images/logo-green.png"><div class="name">Happy Fatora</div></div>
  <div class="head">Facturation, Caisse POS &amp; Stock</div>
  <div class="sub">Toute votre boutique dans la poche</div>
  <div class="chips"><span class="chip">Factures</span><span class="chip">Caisse POS</span><span class="chip">Stock</span><span class="chip">Code-barres</span><span class="chip">Rapports</span></div>
 </div>
 <div class="bar">
  <div class="contact">
   <div class="c"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#25D366"/><path fill="#fff" d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z" transform="translate(3 3) scale(.75)"/></svg><div><small>WhatsApp - Égypte</small><b>01004331221</b></div></div>
   <div class="c"><div><small>Depuis l&#x27;étranger</small><b>+201004331221</b></div></div>
  </div>
  <div class="co"><small>Par</small><b style="white-space:nowrap">Nawafez Systems</b><span>www.nawafezsystems.com</span></div>
 </div>
</div></body></html>
