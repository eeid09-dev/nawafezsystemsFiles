<style>
:root{--g:#4CAF50;--g2:#2e7d32;--o:#FF9800;--card:#fff;--soft:#eef7ef;--line:#e3ece4}
[data-bs-theme=dark]{--bs-body-bg:#0d1410;--bs-body-color:#e5eee7;--card:#151f19;--soft:#122019;--line:#24352b}
body{font-family:Cairo,system-ui,sans-serif;overflow-x:hidden;scroll-behavior:smooth}
html{scroll-behavior:smooth;scroll-padding-top:80px}
.gt{background:linear-gradient(120deg,var(--g),#9be15d 55%,var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn-g{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0;box-shadow:0 10px 24px -8px rgba(76,175,80,.7);transition:.25s}
.btn-g:hover{color:#fff;transform:translateY(-3px);box-shadow:0 16px 30px -8px rgba(76,175,80,.8)}
.btn-wa{background:#25D366;color:#fff;border:0}.btn-wa:hover{background:#1ebe5b;color:#fff;transform:translateY(-3px)}
.btn{border-radius:14px;font-weight:700;padding:.75rem 1.5rem;transition:.25s}
.navbar{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bs-body-bg) 80%,transparent);border-bottom:1px solid var(--line)}
.brand-logo,.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 16px -6px rgba(76,175,80,.8)}
.brand-logo img,.logo img{width:100%;height:100%;object-fit:cover}
.nav-link{font-weight:600}.nav-link:hover{color:var(--g)}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--g);color:var(--g)}
.hero{position:relative;padding:8.5rem 0 5rem;overflow:hidden;background:radial-gradient(circle at 15% 10%,rgba(76,175,80,.22),transparent 45%),radial-gradient(circle at 90% 70%,rgba(255,152,0,.16),transparent 45%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:fl 9s ease-in-out infinite;pointer-events:none}
.b1{width:280px;height:280px;background:var(--g);top:5%;inset-inline-start:-80px}
.b2{width:220px;height:220px;background:var(--o);bottom:0;inset-inline-end:-60px;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-30px) scale(1.08)}}
.badge-soft{display:inline-flex;gap:.5rem;align-items:center;padding:.4rem 1rem;border-radius:99px;background:var(--soft);color:var(--g2);font-weight:700;border:1px solid var(--line)}
[data-bs-theme=dark] .badge-soft{color:#9be19f}
.hero h1{font-weight:800;font-size:clamp(2.1rem,5.2vw,3.7rem);line-height:1.25}
.stat b{font-size:2rem;font-weight:800;color:var(--g)}
.stage{position:relative;max-width:330px;margin:auto;perspective:1000px}
.phone{border-radius:38px;border:9px solid #111;background:#111;overflow:hidden;box-shadow:0 40px 70px -25px rgba(0,0,0,.55);transition:transform .15s}
.phone img{display:block;width:100%;height:auto}
.chip{position:absolute;display:flex;gap:.6rem;align-items:center;padding:.65rem .9rem;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 16px 34px -14px rgba(0,0,0,.4);font-weight:700;font-size:.85rem;animation:fl 6s ease-in-out infinite}
.chip i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--g)}
.c1{top:14%;inset-inline-start:-14%}.c2{bottom:16%;inset-inline-end:-14%;animation-delay:-3s}.c2 i{background:var(--o)}.c3{top:2%;inset-inline-end:-6%;animation-delay:-1.5s}.c3 i{background:#7e57c2}
.sec{padding:5.5rem 0}.alt{background:var(--soft)}
.sec h2{font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem)}
.fcard{height:100%;padding:1.6rem;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:.3s}
.fcard:hover{transform:translateY(-8px);border-color:var(--g);box-shadow:0 24px 40px -22px rgba(76,175,80,.7)}
.fi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:1rem;background:var(--soft);color:var(--g)}
.fcard:nth-child(3n+2) .fi{background:rgba(255,152,0,.14);color:var(--o)}
.gal{display:flex;gap:1.6rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:1.5rem .5rem 2rem;scrollbar-width:thin}
.gal figure{flex:0 0 230px;margin:0;scroll-snap-align:center;text-align:center}
.gal .phone{border-width:7px;border-radius:30px}.gal figure:hover .phone{transform:translateY(-10px) rotate(-1.5deg)}
.gal figcaption{margin-top:1rem;font-weight:700}
.step{display:flex;gap:1rem;margin-bottom:1.6rem}
.num{flex:0 0 48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;place-items:center;font-weight:800}
.price{height:100%;padding:2rem;border-radius:26px;background:var(--card);border:2px solid var(--line);position:relative;transition:.3s}
.price:hover{transform:translateY(-8px)}
.price.pop{border-color:var(--o);box-shadow:0 26px 50px -26px var(--o)}
.pop .tag{position:absolute;top:-14px;inset-inline-start:24px;background:var(--o);color:#fff;font-weight:700;padding:.2rem 1rem;border-radius:99px;font-size:.85rem}
.amt{font-size:3rem;font-weight:800;color:var(--g)}.pop .amt{color:var(--o)}
.price li{list-style:none;margin:.6rem 0}.price ul{padding:0}.price li i{color:var(--g);margin-inline-end:.5rem}
.accordion-item{border-radius:16px!important;overflow:hidden;margin-bottom:.8rem;border:1px solid var(--line);background:var(--card)}
.accordion-button{font-weight:700;background:var(--card)}.accordion-button:not(.collapsed){color:var(--g);background:var(--soft);box-shadow:none}
.cta{border-radius:32px;padding:3.5rem 1.5rem;color:#fff;text-align:center;background:linear-gradient(135deg,#2e7d32,#4CAF50 60%,#8bc34a);position:relative;overflow:hidden}
.cta:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.12);top:-120px;inset-inline-end:-80px}
.cta .btn-light{color:var(--g2)}
footer{border-top:1px solid var(--line);padding:2rem 0}footer a{color:var(--g);font-weight:700;text-decoration:none}
.wa{position:fixed;bottom:22px;inset-inline-start:22px;z-index:1040;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;font-size:1.9rem;display:grid;place-items:center;box-shadow:0 10px 26px -6px rgba(37,211,102,.8);text-decoration:none}
.wa:before{content:"";position:absolute;inset:0;border-radius:50%;background:#25D366;z-index:-1;animation:pl 2s infinite}
@keyframes pl{to{transform:scale(1.7);opacity:0}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(max-width:575px){.chip{display:none}.hero{padding-top:7rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

#prog{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;z-index:2000;background:linear-gradient(90deg,var(--g),var(--o))}
.gt{background-size:200% auto;animation:sh 6s linear infinite}@keyframes sh{to{background-position:200% center}}
.mq{overflow:hidden;direction:ltr;padding:1.1rem 0;border-block:1px solid var(--line);background:var(--card)}
.mq-track{display:flex;gap:1rem;width:max-content;animation:mq 34s linear infinite}.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-i{display:flex;align-items:center;gap:.6rem;padding:.55rem 1.2rem;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:700;white-space:nowrap}.mq-i i{color:var(--g);font-size:1.2rem}
.fcard{position:relative;overflow:hidden}
.fcard:before{content:"";position:absolute;inset:0;opacity:0;transition:.3s;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),rgba(76,175,80,.18),transparent 70%)}
.fcard:hover:before{opacity:1}.fcard>*{position:relative}
.band{position:relative;overflow:hidden;padding:4rem 0;color:#fff;background:linear-gradient(135deg,#1b5e20,#43a047)}
.band:before{content:"";position:absolute;inset:-50%;background:radial-gradient(rgba(255,255,255,.14) 2px,transparent 2px) 0 0/34px 34px;animation:dr 22s linear infinite}
@keyframes dr{to{transform:translate(34px,34px)}}
.band b{display:block;font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800}.band .col-6{position:relative}
.kcard{height:100%;display:flex;gap:1rem;padding:1.4rem;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.3s}
.kcard:hover{transform:translateY(-6px);border-color:var(--o)}
.kcard .fi{flex:0 0 52px;height:52px;margin:0;font-size:1.4rem}
.rm{position:relative;height:100%;padding:1.6rem;border-radius:22px;border:2px dashed var(--line);background:var(--card);text-align:center;transition:.3s}
.rm:hover{border-color:var(--o);transform:translateY(-6px)}.rm i{font-size:2rem;color:var(--o)}
.rm small{position:absolute;top:10px;inset-inline-end:12px;color:var(--g);font-weight:700}
.plat{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;opacity:.9}.plat span{display:flex;align-items:center;gap:.4rem}
#top2{position:fixed;bottom:22px;inset-inline-end:22px;z-index:1040;width:46px;height:46px;border-radius:14px;border:0;background:var(--g);color:#fff;display:none;place-items:center;box-shadow:0 10px 24px -8px rgba(76,175,80,.8)}
.gal figure{flex-basis:215px}
</style>
</head>

tb.addEventListener('click',function(){scrollTo({top:0,behavior:'smooth'})});

setTheme(THEME);setLang(LANG);
</script>
